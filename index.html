<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポケストカメラ</title>
<meta name="theme-color" content="#181f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポケストカメラ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root {
  --bg: #111820;
  --card: #18212b;
  --surface: #222c37;
  --surface2: #2b3644;
  --text: #f5f7fa;
  --muted: #aab5c2;
  --border: #3d4b5a;
  --orange: #d45228;
  --orange2: #ff8a4c;
  --guide-opacity: 1;
  --digital-zoom: 1;
  --frame-aspect: 4 / 3;
  --filter: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { overscroll-behavior: none; }
button, input, select { font: inherit; }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; }
.logo { display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.03em; }
.logo-dot { width:14px; height:14px; border-radius:50%; background:var(--orange); box-shadow:0 0 0 4px rgba(212,82,40,.16); }
.header-controls { display:flex; align-items:center; gap:8px; }
.icon { width:20px; height:20px; fill:currentColor; }
.grid-btn, .mode-btn { border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:8px; min-width:42px; min-height:38px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.mode-switch, .shooting-mode-switch, .details-mode-switch { display:flex; gap:8px; }
.mode-btn.active { border-color:var(--orange); background:rgba(212,82,40,.16); color:var(--orange2); }
main { display:flex; justify-content:center; padding:0 12px 20px; }
.card { width:100%; max-width:640px; background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:14px; overflow:hidden; box-shadow:0 12px 36px rgba(0,0,0,.22); }
.stage { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px; min-height:260px; }
.frame-wrap { position:relative; width:min(100%, 600px); display:flex; justify-content:center; align-items:center; }
.holder { position:relative; width:100%; max-width:600px; aspect-ratio:var(--frame-aspect); background:#0b1016; border-radius:8px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.04); touch-action:manipulation; }
.holder img, .camera-video { width:100%; height:100%; object-fit:cover; transform:scale(var(--digital-zoom)); transform-origin:center; filter:var(--filter); image-orientation:from-image; display:block; }
.camera-video { display:none; background:#000; }
body.camera-on .camera-video { display:block; }
body.camera-on .holder > img { display:none; }
.empty { position:absolute; inset:0; display:grid; place-items:center; gap:8px; color:var(--muted); text-align:center; font-size:13px; pointer-events:none; }
body.camera-on .empty, body.has-image .empty { display:none; }
.ring { position:absolute; pointer-events:none; border:2px solid rgba(255,255,255,.16); border-radius:50%; opacity:var(--guide-opacity); display:none; }
.ring-1 { width:86%; height:86%; }
.ring-2 { width:96%; height:96%; }
body.mode-disk .ring { display:block; }
body.mode-gift .ring { display:none; }
.inner-disk-guide { position:absolute; inset:9%; border:2px solid rgba(255,255,255,.4); border-radius:4px; pointer-events:none; opacity:calc(var(--guide-opacity) * .85); display:none; }
body.mode-gift .inner-disk-guide { display:block; }
.camera-guide { position:absolute; inset:0; pointer-events:none; opacity:var(--guide-opacity); }
.guide-line { position:absolute; background:rgba(255,255,255,.36); }
.guide-line-v { top:0; bottom:0; left:50%; width:1px; transform:translateX(-.5px); }
.guide-line-h { left:0; right:0; top:50%; height:1px; transform:translateY(-.5px); }
.grid-overlay { position:absolute; inset:0; pointer-events:none; display:none; }
body.grid-3x3 #grid-3x3, body.grid-center #grid-center { display:block; }
#grid-3x3 .line { position:absolute; background:rgba(255,255,255,.34); }
#grid-3x3 .v1 { left:33.333%; top:0; bottom:0; width:1px; }
#grid-3x3 .v2 { left:66.666%; top:0; bottom:0; width:1px; }
#grid-3x3 .h1 { top:33.333%; left:0; right:0; height:1px; }
#grid-3x3 .h2 { top:66.666%; left:0; right:0; height:1px; }
.center-cross::before, .center-cross::after { content:""; position:absolute; background:rgba(255,255,255,.5); left:50%; top:50%; transform:translate(-50%,-50%); }
.center-cross::before { width:52px; height:1px; }
.center-cross::after { width:1px; height:52px; }
.edge-mark { position:absolute; width:24px; height:24px; border-color:rgba(255,255,255,.45); border-style:solid; }
.mark-t { top:8px; left:50%; transform:translateX(-50%); border-width:2px 0 0 0; }
.mark-b { bottom:8px; left:50%; transform:translateX(-50%); border-width:0 0 2px 0; }
.mark-l { left:8px; top:50%; transform:translateY(-50%); border-width:0 0 0 2px; }
.mark-r { right:8px; top:50%; transform:translateY(-50%); border-width:0 2px 0 0; }
.level-cross { position:absolute; left:50%; top:50%; width:86px; height:86px; transform:translate(-50%,-50%); opacity:.88; display:none; }
body.level-on .level-cross { display:block; }
.level-bar { position:absolute; left:50%; top:50%; background:rgba(255,255,255,.65); border-radius:2px; transform:translate(-50%,-50%); }
.level-horizontal { width:74px; height:2px; }
.level-vertical { width:2px; height:74px; }
.level-center-dot { position:absolute; left:50%; top:50%; width:8px; height:8px; border-radius:50%; background:var(--orange2); transform:translate(-50%,-50%); }
.level-ok .level-center-dot { background:#4ee28a; }
.focus-marker { position:absolute; width:44px; height:44px; border:2px solid var(--orange2); border-radius:50%; left:50%; top:50%; transform:translate(-50%,-50%) scale(.7); opacity:0; pointer-events:none; }
.focus-marker.show { animation:focus-pop .75s ease-out; }
@keyframes focus-pop { 0%{opacity:0;transform:translate(-50%,-50%) scale(1.4)} 20%{opacity:1} 100%{opacity:0;transform:translate(-50%,-50%) scale(.7)} }
.nav-btn { position:absolute; top:50%; transform:translateY(-50%); z-index:8; width:38px; height:54px; border:0; border-radius:10px; background:rgba(0,0,0,.32); color:#fff; font-size:30px; cursor:pointer; }
.nav-btn:disabled { opacity:.18; cursor:default; }
.prev { left:8px; } .next { right:8px; }
.counter { margin-top:8px; min-height:18px; color:var(--muted); font-size:12px; text-align:center; }
.dots { display:flex; justify-content:center; gap:6px; margin-top:6px; min-height:8px; }
.dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35); cursor:pointer; }
.dot.active { background:var(--orange2); }
.controls { border-top:1px solid var(--border); padding:14px; display:grid; gap:12px; }
.thumbs { display:flex; flex-wrap:wrap; gap:6px; max-height:150px; overflow-y:auto; padding:2px; }
.thumb { width:52px; height:52px; border-radius:5px; object-fit:cover; opacity:.55; border:2px solid transparent; cursor:pointer; }
.thumb.active { opacity:1; border-color:var(--orange2); transform:scale(1.04); }
.dropzone { border:2px dashed var(--border); border-radius:8px; padding:14px; text-align:center; background:rgba(255,255,255,.025); }
.dropzone.drag-over { border-color:var(--orange2); background:rgba(212,82,40,.08); }
.drop-label { display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; }
input[type=file] { display:none; }
.camera-actions, .shooting-tools, .image-management, .utility-actions { display:grid; gap:8px; grid-template-columns:1fr; }
.camera-btn { border:1px solid var(--border); background:var(--surface); color:var(--text); padding:.8rem; border-radius:8px; cursor:pointer; }
.camera-btn:active { transform:translateY(1px); }
.camera-btn:disabled { opacity:.45; cursor:default; transform:none; }
.camera-btn.primary { border-color:var(--orange); background:rgba(212,82,40,.18); }
.camera-zoom-panel, .camera-controls { display:grid; gap:10px; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
.zoom-label, .preset-row, .autosave-row, .adjustment-row { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
.zoom-row { display:grid; grid-template-columns:auto 1fr auto auto; gap:8px; align-items:center; }
.zoom-row input { width:100%; min-width:0; }
.zoom-btn { min-width:44px; line-height:1; }
.details-controls { gap:12px; }
.details-controls summary { list-style:none; cursor:pointer; font-weight:700; padding:.25rem 0; }
.details-controls summary::-webkit-details-marker { display:none; }
.details-controls summary::after { content:'▼'; float:right; color:var(--muted); font-size:12px; margin-top:2px; }
.details-controls[open] summary::after { content:'▲'; }
.camera-controls label { display:grid; gap:4px; font-size:13px; }
.camera-controls select, .camera-controls input { width:100%; }
.setting-note, .camera-note { color:var(--muted); font-size:12px; line-height:1.5; margin:0; }
.status-line { color:var(--muted); font-size:12px; min-height:18px; }
.footer { display:flex; justify-content:space-between; align-items:center; padding:0 2px; color:var(--muted); font-size:11px; }
.shooting-tools { display:none; }
body.shooting-mode header,
body.shooting-mode .thumbs,
body.shooting-mode .dropzone,
body.shooting-mode .image-management-details,
body.shooting-mode .camera-controls,
body.shooting-mode .footer,
body.shooting-mode .nav-btn { display:none !important; }
body.shooting-mode .shooting-tools { display:grid; order:3; }
body.shooting-mode .shooting-mode-switch { display:flex; }
body.shooting-mode .camera-actions { grid-template-columns:1fr !important; }
body.shooting-mode #btn-shot { order:1; }
body.shooting-mode #btn-camera { order:2; }
body.shooting-mode #btn-shooting-mode { order:5; }
body.shooting-mode main { padding:0; align-items:stretch; }
body.shooting-mode .card { max-width:none; min-height:100svh; border-radius:0; }
body.shooting-mode .stage { flex:1; justify-content:center; }
body.shooting-mode .controls { padding:10px; }
body.shooting-mode .holder { max-width:100%; }
@media (min-width:520px) { .camera-actions { grid-template-columns:1fr 1fr 1fr; } .image-management { grid-template-columns:1fr 1fr; } .utility-actions { grid-template-columns:1fr 1fr; } }
@media (min-width:768px) { main { padding:20px; } .holder { max-width:600px; } }
</style>
</head>
<body class="mode-disk">
<header>
  <div class="logo"><span class="logo-dot"></span>ポケストポスカ確認用</div>
  <div class="header-controls">
    <button class="grid-btn" id="btn-grid-toggle" type="button" title="グリッド切替">▦</button>
    <div class="mode-switch" aria-label="表示モード">
      <button class="mode-btn active" id="btn-disk" type="button" title="●"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></button>
      <button class="mode-btn" id="btn-gift" type="button" title="■"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button>
    </div>
  </div>
</header>
<main>
  <div class="card">
    <div class="stage" id="stage">
      <button class="nav-btn prev" id="btn-prev" type="button" disabled aria-label="前の画像">‹</button>
      <button class="nav-btn next" id="btn-next" type="button" disabled aria-label="次の画像">›</button>
      <div class="frame-wrap">
        <div class="ring ring-2"></div>
        <div class="ring ring-1"></div>
        <div class="holder" id="holder">
          <video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>
          <div class="inner-disk-guide" aria-hidden="true"></div>
          <div class="camera-guide" id="cameraGuide">
            <div class="guide-line guide-line-v"></div>
            <div class="guide-line guide-line-h"></div>
            <div class="level-cross" id="levelCross"><div class="level-bar level-horizontal"></div><div class="level-bar level-vertical"></div><div class="level-center-dot"></div></div>
          </div>
          <div class="focus-marker" id="focusMarker"></div>
          <div id="grid-3x3" class="grid-overlay"><div class="line v1"></div><div class="line v2"></div><div class="line h1"></div><div class="line h2"></div></div>
          <div id="grid-center" class="grid-overlay"><div class="center-cross"></div><div class="edge-mark mark-t"></div><div class="edge-mark mark-b"></div><div class="edge-mark mark-l"></div><div class="edge-mark mark-r"></div></div>
          <div class="empty" id="emptyState"><span>画像をドロップ<br>または下から選択</span></div>
        </div>
      </div>
      <div class="counter" id="counter"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="controls">
      <div class="thumbs" id="thumbs" hidden></div>
      <div class="camera-zoom-panel">
        <label class="zoom-label"><span>ズーム</span><span id="zoomValue">1.0x</span></label>
        <div class="zoom-row">
          <button class="camera-btn zoom-btn" id="btn-zoom-out" type="button">－</button>
          <input type="range" id="zoomRange" min="1" max="4" step="0.1" value="1">
          <button class="camera-btn zoom-btn" id="btn-zoom-in" type="button">＋</button>
          <button class="camera-btn zoom-btn" id="btn-zoom-reset" type="button">1x</button>
        </div>
      </div>
      <div class="camera-actions">
        <button class="camera-btn" id="btn-camera" type="button">カメラ起動</button>
        <button class="camera-btn" id="btn-shooting-mode" type="button">撮影モード</button>
        <button class="camera-btn primary" id="btn-shot" type="button" disabled>この枠で撮影</button>
      </div>
      <div class="shooting-tools" aria-label="撮影モード用操作">
        <div class="shooting-mode-switch" aria-label="撮影モード用の枠切替">
          <button class="mode-btn" id="btn-disk-shooting" type="button" title="●"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></button>
          <button class="mode-btn active" id="btn-gift-shooting" type="button" title="■"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button>
        </div>
        <button class="camera-btn" id="btn-save-all-shooting" type="button" disabled>全保存</button>
        <button class="camera-btn" id="btn-clear-all-shooting" type="button" disabled>全削除</button>
      </div>
      <div class="dropzone" id="dropzone">
        <label class="drop-label" for="fileInput">画像を追加（複数可）</label>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>
      <details class="camera-controls details-controls image-management-details">
        <summary>画像管理</summary>
        <div class="image-management">
          <button class="camera-btn" id="btn-save" type="button" disabled>選択画像を保存/共有</button>
          <button class="camera-btn" id="btn-rotate-left" type="button" disabled>左回転</button>
          <button class="camera-btn" id="btn-rotate-right" type="button" disabled>右回転</button>
          <button class="camera-btn" id="btn-delete-current" type="button" disabled>選択画像を削除</button>
          <button class="camera-btn" id="btn-save-all" type="button" disabled>全保存</button>
          <button class="camera-btn" id="btn-clear-all" type="button" disabled>全削除</button>
        </div>
      </details>
      <details class="camera-controls details-controls">
        <summary>詳細設定</summary>
        <label>表示モード
          <div class="details-mode-switch">
            <button class="mode-btn active" id="btn-disk-detail" type="button">●</button>
            <button class="mode-btn" id="btn-gift-detail" type="button">■</button>
          </div>
        </label>
        <label>アスペクト比
          <select id="aspectSelect">
            <option value="1/1">1:1 正方形</option>
            <option value="4/3" selected>4:3 横</option>
            <option value="3/4">3:4 縦</option>
            <option value="16/9">16:9 横長</option>
            <option value="9/16">9:16 縦長</option>
          </select>
        </label>
        <label>ガイド濃度 <span id="guideOpacityValue">100%</span>
          <input type="range" id="guideOpacity" min="0" max="100" value="100">
        </label>
        <div class="preset-row"><label>補正プリセット<select id="presetSelect"><option value="normal">標準</option><option value="day">昼用</option><option value="sunset">夕方・黄み補正</option><option value="night">夜用</option><option value="indoor">室内・黄み補正</option><option value="softguide">ガイド薄め</option></select></label><button class="camera-btn" id="btn-apply-preset" type="button">適用</button></div>
        <div class="utility-actions">
          <button class="camera-btn" id="btn-level" type="button">水準器 ON/OFF</button>
          <button class="camera-btn" id="btn-refocus" type="button">フォーカス再調整</button>
          <button class="camera-btn" id="btn-reset-settings" type="button">設定リセット</button>
        </div>
        <p class="camera-note" id="cameraNote">カメラ起動後に対応機能を確認します。</p>
      </details>
      <div class="footer"><span>PC: 矢印キーで切替 / スマホ: スワイプ</span><span id="versionText">v1.25-rotate-tools-full</span></div>
    </div>
  </div>
</main>
<script>
(() => {
'use strict';
const VERSION = 'v1.25-rotate-tools-full';
const $ = id => document.getElementById(id);
const els = {
  holder:$('holder'), video:$('cameraVideo'), fileInput:$('fileInput'), dropzone:$('dropzone'), thumbs:$('thumbs'), counter:$('counter'), dots:$('dots'),
  prev:$('btn-prev'), next:$('btn-next'), camera:$('btn-camera'), shot:$('btn-shot'), shooting:$('btn-shooting-mode'), save:$('btn-save'), deleteCurrent:$('btn-delete-current'),
  saveAll:$('btn-save-all'), clearAll:$('btn-clear-all'), saveAllShooting:$('btn-save-all-shooting'), clearAllShooting:$('btn-clear-all-shooting'),
  rotateLeft:$('btn-rotate-left'), rotateRight:$('btn-rotate-right'), zoom:$('zoomRange'), zoomValue:$('zoomValue'), zoomOut:$('btn-zoom-out'), zoomIn:$('btn-zoom-in'), zoomReset:$('btn-zoom-reset'),
  grid:$('btn-grid-toggle'), aspect:$('aspectSelect'), guideOpacity:$('guideOpacity'), guideOpacityValue:$('guideOpacityValue'), preset:$('presetSelect'), applyPreset:$('btn-apply-preset'),
  level:$('btn-level'), refocus:$('btn-refocus'), reset:$('btn-reset-settings'), cameraNote:$('cameraNote'), focusMarker:$('focusMarker')
};
let items = [];
let current = -1;
let cameraStream = null;
let gridMode = 0;
let touchStartX = 0;
let levelEnabled = false;
let wakeLock = null;
const objectUrls = new Set();
function activeItem(){ return items[current] || null; }
function revokeItem(item){ if (item && item.url) { URL.revokeObjectURL(item.url); objectUrls.delete(item.url); } }
function safeName(name, ext='jpg'){ return String(name || ('pscamera_' + Date.now() + '.' + ext)).replace(/[\\/:*?"<>|]+/g, '_'); }
async function blobToFile(blob, name){ return new File([blob], safeName(name), { type: blob.type || 'image/jpeg', lastModified: Date.now() }); }
function canvasToBlob(canvas, type='image/jpeg', quality=.95){ return new Promise(resolve => canvas.toBlob(resolve, type, quality)); }
async function normalizeFile(file){
  if (!file || !file.type || !file.type.startsWith('image/')) return null;
  if (/image\/(gif|svg\+xml)/i.test(file.type)) return file;
  if (!('createImageBitmap' in window)) return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    const ctx = c.getContext('2d'); ctx.drawImage(bmp,0,0); if (bmp.close) bmp.close();
    const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    const blob = await canvasToBlob(c, type, .95);
    if (!blob) return file;
    return new File([blob], safeName(file.name, type.includes('png')?'png':'jpg'), { type, lastModified:file.lastModified || Date.now() });
  } catch(e){ console.log('normalize skipped', e); return file; }
}
async function addFiles(fileList){
  const files = Array.from(fileList || []);
  for (const f of files) {
    const file = await normalizeFile(f);
    if (!file) continue;
    const url = URL.createObjectURL(file); objectUrls.add(url);
    items.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()), file, url, name:file.name });
  }
  if (items.length && current < 0) current = 0;
  if (items.length) current = Math.min(current < 0 ? 0 : current, items.length - 1);
  render();
}
function setMode(mode){
  document.body.classList.toggle('mode-disk', mode === 'disk');
  document.body.classList.toggle('mode-gift', mode === 'gift');
  ['btn-disk','btn-disk-shooting','btn-disk-detail'].forEach(id => $(id)?.classList.toggle('active', mode === 'disk'));
  ['btn-gift','btn-gift-shooting','btn-gift-detail'].forEach(id => $(id)?.classList.toggle('active', mode === 'gift'));
}
function setShooting(on){
  document.body.classList.toggle('shooting-mode', !!on);
  els.shooting.textContent = on ? '通常表示' : '撮影モード';
  if (on) setMode('gift');
  updateButtons();
}
function updateButtons(){
  const has = items.length > 0, one = !!activeItem();
  document.body.classList.toggle('has-image', has);
  [els.save, els.deleteCurrent, els.rotateLeft, els.rotateRight].forEach(b => b.disabled = !one);
  [els.saveAll, els.clearAll, els.saveAllShooting, els.clearAllShooting].forEach(b => b.disabled = !has);
  els.prev.disabled = !has || current <= 0;
  els.next.disabled = !has || current >= items.length - 1;
  els.thumbs.hidden = !has;
  els.shot.disabled = !cameraStream;
}
function renderMain(){
  els.holder.querySelectorAll('img.preview-image').forEach(n => n.remove());
  const item = activeItem();
  if (item && !cameraStream) {
    const img = document.createElement('img');
    img.className = 'preview-image'; img.alt = item.name || 'image'; img.src = item.url;
    els.holder.insertBefore(img, els.holder.firstChild);
  }
  els.counter.textContent = items.length ? `${current + 1} / ${items.length}` : '';
}
function renderThumbs(){
  els.thumbs.innerHTML = '';
  items.forEach((item, i) => {
    const img = document.createElement('img'); img.className = 'thumb' + (i === current ? ' active' : ''); img.src = item.url; img.alt = item.name || '';
    img.addEventListener('click', () => { current = i; render(); });
    els.thumbs.appendChild(img);
  });
  els.dots.innerHTML = '';
  items.forEach((_, i) => {
    const d = document.createElement('div'); d.className = 'dot' + (i === current ? ' active' : ''); d.addEventListener('click', () => { current = i; render(); }); els.dots.appendChild(d);
  });
}
function render(){ renderMain(); renderThumbs(); updateButtons(); }
function go(delta){ if (!items.length) return; current = Math.max(0, Math.min(items.length - 1, current + delta)); render(); }
async function saveFile(file){
  if (!file) return;
  if (navigator.canShare && navigator.canShare({ files:[file] })) {
    try { await navigator.share({ files:[file], title:file.name }); return; } catch(e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = safeName(file.name); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function saveAll(){
  const files = items.map(x => x.file).filter(Boolean);
  if (!files.length) return;
  if (navigator.canShare && navigator.canShare({ files })) { try { await navigator.share({ files, title:'pscamera images' }); return; } catch(e) { if (e && e.name === 'AbortError') return; } }
  for (let i=0; i<files.length; i++) setTimeout(() => saveFile(files[i]), i * 350);
}
function deleteCurrent(){
  if (!activeItem()) return;
  revokeItem(activeItem());
  items.splice(current, 1);
  if (!items.length) current = -1; else current = Math.max(0, Math.min(current, items.length - 1));
  render();
}
function clearAll(keepShooting=false){
  items.forEach(revokeItem); items = []; current = -1; render();
  if (keepShooting) setShooting(true);
}
async function rotateCurrent(direction){
  const item = activeItem(); if (!item) return;
  const bmp = await createImageBitmap(item.file, { imageOrientation:'from-image' });
  const c = document.createElement('canvas'); c.width = bmp.height; c.height = bmp.width;
  const ctx = c.getContext('2d');
  if (direction === 'left') { ctx.translate(0, c.height); ctx.rotate(-Math.PI / 2); }
  else { ctx.translate(c.width, 0); ctx.rotate(Math.PI / 2); }
  ctx.drawImage(bmp, 0, 0); if (bmp.close) bmp.close();
  const blob = await canvasToBlob(c, item.file.type === 'image/png' ? 'image/png' : 'image/jpeg', .95);
  if (!blob) return;
  const base = item.name.replace(/\.[^.]+$/, ''); const ext = blob.type.includes('png') ? 'png' : 'jpg';
  const file = await blobToFile(blob, `${base}_${direction === 'left' ? 'left' : 'right'}.${ext}`);
  revokeItem(item);
  item.file = file; item.name = file.name; item.url = URL.createObjectURL(file); objectUrls.add(item.url);
  render();
}
function setZoom(v){
  v = Math.max(1, Math.min(4, Number(v) || 1));
  els.zoom.value = String(v.toFixed(1));
  els.zoomValue.textContent = `${v.toFixed(1)}x`;
  document.documentElement.style.setProperty('--digital-zoom', String(v));
}
function setAspect(value){
  const [w,h] = String(value).split('/').map(Number);
  if (w && h) document.documentElement.style.setProperty('--frame-aspect', `${w} / ${h}`);
}
function setGuideOpacity(v){
  v = Math.max(0, Math.min(100, Number(v) || 0));
  document.documentElement.style.setProperty('--guide-opacity', String(v / 100));
  els.guideOpacityValue.textContent = `${Math.round(v)}%`;
}
function applyPreset(){
  const p = els.preset.value;
  const filters = { normal:'none', day:'brightness(1.04) contrast(1.05) saturate(1.04)', sunset:'brightness(1.03) contrast(1.04) saturate(.94) hue-rotate(-4deg)', night:'brightness(1.13) contrast(1.05) saturate(.92)', indoor:'brightness(1.06) contrast(1.03) saturate(.92) hue-rotate(-6deg)', softguide:'none' };
  document.documentElement.style.setProperty('--filter', filters[p] || 'none');
  if (p === 'softguide') { els.guideOpacity.value = '45'; setGuideOpacity(45); }
}
async function startCamera(){
  if (cameraStream) { stopCamera(); return; }
  try {
    const constraints = { video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false };
    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    els.video.srcObject = cameraStream;
    await els.video.play();
    document.body.classList.add('camera-on');
    els.camera.textContent = '■ 停止';
    els.cameraNote.textContent = 'カメラ起動中。横向きで保存画像が回転した場合は、画像管理の左回転/右回転で補正してください。';
    updateButtons();
    requestWakeLock();
  } catch(e){ console.error(e); alert('カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。'); }
}
function stopCamera(){
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  els.video.srcObject = null; document.body.classList.remove('camera-on'); els.camera.textContent = 'カメラ起動'; releaseWakeLock(); render();
}
function getOutputSize(){
  const [w,h] = String(els.aspect.value).split('/').map(Number);
  const longSide = 1600;
  if (!w || !h) return { width:1600, height:1200 };
  return w >= h ? { width:longSide, height:Math.round(longSide*h/w) } : { width:Math.round(longSide*w/h), height:longSide };
}
async function capture(){
  if (!cameraStream || !els.video.videoWidth) return;
  const outSize = getOutputSize();
  const sourceW = els.video.videoWidth, sourceH = els.video.videoHeight;
  const destAspect = outSize.width / outSize.height, sourceAspect = sourceW / sourceH;
  let cropW, cropH;
  if (sourceAspect > destAspect) { cropH = sourceH; cropW = cropH * destAspect; } else { cropW = sourceW; cropH = cropW / destAspect; }
  const zoom = Math.max(1, Number(els.zoom.value) || 1);
  cropW /= zoom; cropH /= zoom;
  const sx = (sourceW - cropW) / 2, sy = (sourceH - cropH) / 2;
  const c = document.createElement('canvas'); c.width = outSize.width; c.height = outSize.height;
  const ctx = c.getContext('2d'); const filter = getComputedStyle(els.video).filter; if (filter && filter !== 'none') ctx.filter = filter;
  ctx.drawImage(els.video, sx, sy, cropW, cropH, 0, 0, c.width, c.height);
  ctx.filter = 'none';
  const blob = await canvasToBlob(c, 'image/jpeg', .95);
  if (!blob) return;
  const d = new Date(); const pad = n => String(n).padStart(2,'0');
  const name = `pscamera_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`;
  await addFiles([new File([blob], name, { type:'image/jpeg', lastModified:Date.now() })]);
  els.shot.textContent = '撮影しました'; setTimeout(() => els.shot.textContent = 'この枠で撮影', 700);
}
async function requestWakeLock(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(_){} }
function releaseWakeLock(){ try { if (wakeLock) wakeLock.release(); } catch(_){} wakeLock = null; }
async function refocus(){
  const track = cameraStream && cameraStream.getVideoTracks()[0]; if (!track) return;
  try { await track.applyConstraints({ advanced:[{ focusMode:'continuous' }] }); els.cameraNote.textContent = 'フォーカス再調整を試しました。'; } catch(e){ els.cameraNote.textContent = 'この端末ではフォーカス再調整に対応していない可能性があります。'; }
}
function flashFocus(x=50,y=50){ els.focusMarker.style.left = x + '%'; els.focusMarker.style.top = y + '%'; els.focusMarker.classList.remove('show'); void els.focusMarker.offsetWidth; els.focusMarker.classList.add('show'); }
function resetSettings(){ setMode('disk'); setZoom(1); els.aspect.value='4/3'; setAspect('4/3'); els.guideOpacity.value='100'; setGuideOpacity(100); els.preset.value='normal'; applyPreset(); document.body.classList.remove('grid-3x3','grid-center','level-on','level-ok'); gridMode=0; levelEnabled=false; }
function handleOrientation(e){
  if (!levelEnabled) return;
  const beta = e.beta || 0, gamma = e.gamma || 0;
  const ok = Math.abs(beta) < 3 && Math.abs(gamma) < 3;
  document.body.classList.toggle('level-ok', ok);
  const cross = $('levelCross'); if (cross) cross.style.transform = `translate(-50%,-50%) rotate(${Math.max(-20, Math.min(20, gamma))}deg)`;
}
async function toggleLevel(){
  levelEnabled = !levelEnabled; document.body.classList.toggle('level-on', levelEnabled);
  if (levelEnabled && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') { try { await DeviceOrientationEvent.requestPermission(); } catch(_){} }
}
function registerServiceWorker(){ if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn)); }
els.fileInput.addEventListener('change', e => addFiles(e.target.files));
els.dropzone.addEventListener('dragover', e => { e.preventDefault(); els.dropzone.classList.add('drag-over'); });
els.dropzone.addEventListener('dragleave', () => els.dropzone.classList.remove('drag-over'));
els.dropzone.addEventListener('drop', e => { e.preventDefault(); els.dropzone.classList.remove('drag-over'); addFiles(e.dataTransfer.files); });
els.prev.addEventListener('click', () => go(-1)); els.next.addEventListener('click', () => go(1));
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
els.holder.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive:true });
els.holder.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - touchStartX; if (Math.abs(dx) > 45) go(dx > 0 ? -1 : 1); }, { passive:true });
els.holder.addEventListener('click', e => { const r = els.holder.getBoundingClientRect(); flashFocus(((e.clientX-r.left)/r.width)*100, ((e.clientY-r.top)/r.height)*100); });
els.save.addEventListener('click', () => saveFile(activeItem()?.file)); els.saveAll.addEventListener('click', saveAll); els.saveAllShooting.addEventListener('click', saveAll);
els.deleteCurrent.addEventListener('click', deleteCurrent); els.clearAll.addEventListener('click', () => clearAll(false)); els.clearAllShooting.addEventListener('click', () => clearAll(true));
els.rotateLeft.addEventListener('click', () => rotateCurrent('left')); els.rotateRight.addEventListener('click', () => rotateCurrent('right'));
els.camera.addEventListener('click', startCamera); els.shot.addEventListener('click', capture); els.shooting.addEventListener('click', () => setShooting(!document.body.classList.contains('shooting-mode')));
['btn-disk','btn-disk-shooting','btn-disk-detail'].forEach(id => $(id).addEventListener('click', () => setMode('disk')));
['btn-gift','btn-gift-shooting','btn-gift-detail'].forEach(id => $(id).addEventListener('click', () => setMode('gift')));
els.zoom.addEventListener('input', e => setZoom(e.target.value)); els.zoomOut.addEventListener('click', () => setZoom(Number(els.zoom.value)-.1)); els.zoomIn.addEventListener('click', () => setZoom(Number(els.zoom.value)+.1)); els.zoomReset.addEventListener('click', () => setZoom(1));
els.grid.addEventListener('click', () => { gridMode = (gridMode + 1) % 3; document.body.classList.toggle('grid-3x3', gridMode === 1); document.body.classList.toggle('grid-center', gridMode === 2); });
els.aspect.addEventListener('change', e => setAspect(e.target.value)); els.guideOpacity.addEventListener('input', e => setGuideOpacity(e.target.value)); els.applyPreset.addEventListener('click', applyPreset);
els.level.addEventListener('click', toggleLevel); els.refocus.addEventListener('click', refocus); els.reset.addEventListener('click', resetSettings); window.addEventListener('deviceorientation', handleOrientation);
window.addEventListener('beforeunload', () => { items.forEach(revokeItem); stopCamera(); });
$('versionText').textContent = VERSION;
resetSettings(); registerServiceWorker(); render();
})();
</script>
</body>
